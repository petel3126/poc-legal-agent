version: '3.8'

services:
  # 1. Dịch vụ Web Chatbot & FastAPI Backend
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_ai_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=legalpassword123
    env_file:
      - .env
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      - neo4j
    networks:
      - legal_network

  # 2. Dịch vụ Cơ sở Dữ liệu Đồ thị Neo4j
  neo4j:
    image: neo4j:5.15.0-community
    container_name: legal_ai_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser Web UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/legalpassword123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - legal_network

networks:
  legal_network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
